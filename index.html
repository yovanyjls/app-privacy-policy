<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policies</title>
    <style>
        :root {
            --text: #1f2933;
            --muted: #616e7c;
            --heading: #12263f;
            --accent: #1f5f99;
            --border: #d9dee3;
            --bg: #f4f6f8;
            --page: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.7;
        }
        main {
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 56px;
            background: var(--page);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        h1 {
            margin: 0 0 8px;
            padding-bottom: 16px;
            color: var(--heading);
            font-size: 2rem;
            line-height: 1.3;
            border-bottom: 3px solid var(--accent);
        }
        p { margin: 0 0 1rem; }
        .intro { color: var(--muted); }
        ul { margin: 0 0 1rem; padding-left: 1.5rem; }
        li { margin-bottom: 0.4rem; }
        a { color: var(--accent); text-decoration: underline; }
        a:hover { text-decoration: none; }
        @media (max-width: 600px) {
            body { padding: 0; }
            main { padding: 28px 20px; border: none; border-radius: 0; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<main>
<h1>Privacy Policies</h1>
<p class="intro">Privacy policies for the apps published by Zanaxú Apps.</p>
<ul>
<li><a href="denomination-counter/">Denomination Counter</a></li>
<li><a href="estampitas-2026/">Estampitas Mundial 2026</a></li>
<li><a href="privacy-policy-generator/">Privacy Policy Generator</a></li>
<li><a href="radio-music-deutsche/">Radio Music Deutsche</a></li>
</ul>
</main>
</body>
</html>
